<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 6</title>
    <link rel="stylesheet" href="style_task6.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Галерея изображений</h1>
            <p>Введите номер страницы (1–10) и лимит (1–10)</p>
            
            <div class="input-group">
                <div class="input-field">
                    <label>Номер страницы</label>
                    <input type="number" id="pageInput" placeholder="от 1 до 10" min="1" max="10">
                </div>
                
                <div class="input-field">
                    <label>Лимит</label>
                    <input type="number" id="limitInput" placeholder="от 1 до 10" min="1" max="10">
                </div>
                
                <button id="fetchButton">Запрос</button>
            </div>
            
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            
            <div id="gallery" class="gallery"></div>
        </div>
    </div>
    
    <script src="6.js"></script>
</body>
</html>
